[profile.default]
src = "contracts"
out = "forge-out"
libs = ["node_modules", "lib"]
test = "test/foundry"
cache_path = "forge-cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false

# Fuzz testing configuration
[fuzz]
runs = 256
max_test_rejects = 65536
seed = "0x1"

# Invariant testing configuration
[invariant]
runs = 256
depth = 15
fail_on_revert = false

# Base network fork testing
[rpc_endpoints]
base_mainnet = "${BASE_MAINNET_RPC_URL}"
base_testnet = "${BASE_TESTNET_RPC_URL}"
